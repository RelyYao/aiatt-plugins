name: 新插件提议 / Plugin proposal
description: 想写一个新游戏？先说说想法 / Planning a new game? Describe the idea first
labels: ["type: new-plugin"]
body:
  - type: input
    id: name
    attributes:
      label: 名称 / Name
    validations:
      required: true
  - type: textarea
    id: pitch
    attributes:
      label: 玩法 / Gameplay
      description: 规则、胜负和排名、一局多久 / Rules, winning and ranking, length of a match
    validations:
      required: true
  - type: input
    id: seats
    attributes:
      label: 座位数和队伍 / Seats and teams
      placeholder: 2-4 seats, solo
    validations:
      required: true
  - type: textarea
    id: hidden
    attributes:
      label: 隐藏信息 / Hidden information
      description: 有没有手牌、暗棋、秘密身份？ / Hands, covered pieces, secret roles?
  - type: textarea
    id: agents
    attributes:
      label: Agent 怎么玩 / How Agents play
      description: 一个决策点需要告诉 Agent 什么，它怎么回答 / What an Agent is told at a decision point and how it answers
